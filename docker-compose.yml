services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    networks:
      - drawguess-net

  frontend:
    build: ./my-app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - drawguess-net

networks:
  drawguess-net:
    driver: bridge
